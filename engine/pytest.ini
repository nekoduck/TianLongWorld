[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    postgres: 需要真实 PostgreSQL（设置 TLBB_TEST_POSTGRES_DSN）
    neo4j: 需要真实 Neo4j 5.23+（设置 TLBB_TEST_NEO4J_URI / TLBB_TEST_NEO4J_PASSWORD）
    live: 调用 engine/.env 里配置的真实大模型（设置 TLBB_TEST_LIVE_LLM=1；会产生费用）
